---
- name: Recoger estado de nodos RKE2
  hosts: rke2_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Recoger versión RKE2 por nodo
      ansible.builtin.import_role:
        name: status
        tasks_from: node

- name: Generar estado de plataforma RKE2
  hosts: rke2_servers
  become: true
  gather_facts: false
  tasks:
    - name: Generar estado desde el bootstrap server
      ansible.builtin.import_role:
        name: status
        tasks_from: platform
      when: rke2_first_server | default(false) | bool
