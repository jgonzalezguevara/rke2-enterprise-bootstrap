---
- name: Construir estado de seguridad de hosts
  ansible.builtin.set_fact:
    security_host_assessments: >-
      {%- set hosts = [] -%}
      {%- for host in groups['rke2_cluster'] -%}
      {%-   set checks = hostvars[host].security_node_checks | default({}) -%}
      {%-   set _ = hosts.append({
              'host': host,
              'ssh_root_login': (
                checks.ssh_root_login.status | default('FAIL')
              ),
              'ssh_password_authentication': (
                checks.ssh_password_authentication.status | default('FAIL')
              ),
              'firewall': (
                checks.firewall.status | default('FAIL')
              ),
              'mandatory_access_control': (
                checks.mandatory_access_control.status | default('FAIL')
              ),
              'rke2_config_permissions': (
                checks.rke2_config_permissions.status | default('FAIL')
              ),
              'kubeconfig_permissions': (
                checks.kubeconfig_permissions.status | default('FAIL')
              )
            }) -%}
      {%- endfor -%}
      {{ hosts }}

- name: Construir controles de hosts agregados
  ansible.builtin.set_fact:
    security_host_check_states: >-
      {%- set states = [] -%}
      {%- for host in security_host_assessments -%}
      {%-   set _ = states.extend([
              host.ssh_root_login,
              host.ssh_password_authentication,
              host.firewall,
              host.mandatory_access_control,
              host.rke2_config_permissions,
              host.kubeconfig_permissions
            ]) -%}
      {%- endfor -%}
      {{ states }}

- name: Evaluar postura global de hosts
  ansible.builtin.set_fact:
    security_host_posture: >-
      {{
        'FAIL'
        if 'FAIL' in security_host_check_states
        else (
          'WARN'
          if 'WARN' in security_host_check_states
          else 'PASS'
        )
      }}
