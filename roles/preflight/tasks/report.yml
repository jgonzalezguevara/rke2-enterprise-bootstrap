---
- name: Mostrar informe de compatibilidad
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "RKE2 PREFLIGHT REPORT"
      - "============================================================"
      - "Host: {{ inventory_hostname }}"
      - ""
      - "Platform"
      - "--------"
      - "Distribution : {{ preflight_distribution }} {{ preflight_distribution_version }}"
      - "Kernel       : {{ preflight_kernel }}"
      - "Package mgr  : {{ preflight_package_manager }}"
      - ""
      - "Checks"
      - "------"
      - "Linux          {{ preflight_checks.linux.status }}  {{ preflight_checks.linux.detail }}"
      - "Architecture   {{ preflight_checks.architecture.status }}  {{ preflight_checks.architecture.detail }}"
      - "systemd        {{ preflight_checks.systemd.status }}  {{ preflight_checks.systemd.detail }}"
      - "cgroups        {{ preflight_checks.cgroups.status }}  {{ preflight_checks.cgroups.detail }}"
      - "overlay        {{ preflight_checks.overlay.status }}  {{ preflight_checks.overlay.detail }}"
      - "br_netfilter   {{ preflight_checks.br_netfilter.status }}  {{ preflight_checks.br_netfilter.detail }}"
      - "CPU            {{ preflight_checks.cpu.status }}  {{ preflight_checks.cpu.detail }}"
      - "Memory         {{ preflight_checks.memory.status }}  {{ preflight_checks.memory.detail }}"
      - "Swap           {{ preflight_checks.swap.status }}  {{ preflight_checks.swap.detail }}"
      - "Root space     {{ preflight_checks.root_space.status }}  {{ preflight_checks.root_space.detail }}"
      - "DNS            {{ preflight_checks.dns.status }}  {{ preflight_checks.dns.detail }}"
      - "Previous RKE2  {{ preflight_checks.previous_rke2.status }}  {{ preflight_checks.previous_rke2.detail }}"
      - ""
      - "Network"
      - "-------"
      - "Interface      {{ preflight_default_interface }}"
      - "Address        {{ preflight_default_address }}"
      - "Gateway        {{ preflight_default_gateway }}"
      - "MTU            {{ preflight_default_mtu }}"
      - "API DNS        {{ preflight_checks.api_dns.status }}  {{ preflight_checks.api_dns.detail }}"
      - "Rancher DNS    {{ preflight_checks.rancher_dns.status }}  {{ preflight_checks.rancher_dns.detail }}"
      - "Inter-node     {{ preflight_checks.inter_node.status }}  {{ preflight_checks.inter_node.detail }}"
      - "CIDR conflicts {{ preflight_checks.cidr_conflicts.status }}  {{ preflight_checks.cidr_conflicts.detail }}"
      - "Node addresses {{ preflight_checks.cluster_addresses.status }}  {{ preflight_checks.cluster_addresses.detail }}"
      - "Cluster MTU    {{ preflight_checks.cluster_mtu.status }}  {{ preflight_checks.cluster_mtu.detail }}"
      - "API endpoint   {{ preflight_checks.api_endpoint.status }}  {{ preflight_checks.api_endpoint.detail }}"
      - ""
      - "Host state"
      - "----------"
      - "Ports          {{ preflight_checks.occupied_ports.status }}  {{ preflight_checks.occupied_ports.detail }}"
      - "Existing RKE2  {{ preflight_checks.existing_services.status }}  {{ preflight_checks.existing_services.detail }}"
      - "Firewall       {{ preflight_checks.firewall.status }}  {{ preflight_checks.firewall.detail }}"
      - "SELinux        {{ preflight_checks.selinux.status }}  {{ preflight_checks.selinux.detail }}"
      - "AppArmor       {{ preflight_checks.apparmor.status }}  {{ preflight_checks.apparmor.detail }}"
      - "Proxy          {{ preflight_checks.proxy.status }}  {{ preflight_checks.proxy.detail }}"
      - "Docker         {{ 'detected' if preflight_docker.rc == 0 else 'not detected' }}"
      - "containerd     {{ 'detected' if preflight_containerd.rc == 0 else 'not detected' }}"
      - ""
      - "Online installation"
      - "-------------------"
      - "RKE2 installer   {{ preflight_checks.rke2_download.status }}  {{ preflight_checks.rke2_download.detail }}"
      - "Rancher charts   {{ preflight_checks.rancher_repository.status }}  {{ preflight_checks.rancher_repository.detail }}"
      - "cert-manager     {{ preflight_checks.certmanager_repository.status }}  {{ preflight_checks.certmanager_repository.detail }}"
      - ""
      - "RESULT         {{ 'COMPATIBLE' if preflight_failed_checks | length == 0 else 'INCOMPATIBLE' }}"
      - "============================================================"
