---
- name: Crear directorio RKE2
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Comprobar si RKE2 está instalado
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Obtener versión RKE2 instalada
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2 --version
  register: rke2_installed_version_command
  changed_when: false
  failed_when: false
  when: rke2_binary.stat.exists

- name: Extraer versión RKE2 instalada
  ansible.builtin.set_fact:
    rke2_installed_version: >-
      {{
        rke2_installed_version_command.stdout
        | regex_search('rke2 version ([^ ]+)', '\\1')
        | default([], true)
        | first
        | default('')
      }}
  when:
    - rke2_binary.stat.exists
    - rke2_installed_version_command.rc == 0

- name: Inicializar versión RKE2 cuando no está disponible
  ansible.builtin.set_fact:
    rke2_installed_version: ""
  when:
    - not rke2_binary.stat.exists
      or rke2_installed_version_command.rc | default(1) != 0

- name: Validar lectura de versión RKE2 existente
  ansible.builtin.assert:
    that:
      - not rke2_binary.stat.exists or rke2_installed_version | length > 0
    fail_msg: >-
      RKE2 está instalado en {{ inventory_hostname }}, pero no se pudo
      determinar su versión. El bootstrap se detiene para evitar cambios
      sobre una instalación cuyo estado no puede verificarse.

- name: Validar versión RKE2 existente
  ansible.builtin.assert:
    that:
      - not rke2_binary.stat.exists or rke2_installed_version == rke2_version
    fail_msg: >-
      RKE2 {{ rke2_installed_version | default('unknown') }} está instalado
      en {{ inventory_hostname }}, pero el inventario solicita
      {{ rke2_version }}. Los cambios de versión requieren un procedimiento
      de upgrade explícito y no se realizan durante el bootstrap.
    success_msg: >-
      {{
        'RKE2 no está instalado; se instalará ' ~ rke2_version
        if not rke2_binary.stat.exists
        else 'RKE2 ' ~ rke2_version ~ ' ya está instalado'
      }}

- name: Configurar server
  ansible.builtin.template:
    src: server-config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Reiniciar RKE2 server
  when: inventory_hostname in groups['rke2_servers']

- name: Configurar agent
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Reiniciar RKE2 agent
  when: inventory_hostname in groups['rke2_agents']

- name: Descargar instalador
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /tmp/install-rke2.sh
    mode: "0755"
  when: not rke2_binary.stat.exists

- name: Instalar server
  ansible.builtin.command:
    cmd: /tmp/install-rke2.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: server
  when:
    - inventory_hostname in groups['rke2_servers']
    - not rke2_binary.stat.exists

- name: Instalar agent
  ansible.builtin.command:
    cmd: /tmp/install-rke2.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: agent
  when:
    - inventory_hostname in groups['rke2_agents']
    - not rke2_binary.stat.exists

- name: Arrancar RKE2
  ansible.builtin.systemd:
    name: "{{ 'rke2-server' if inventory_hostname in groups['rke2_servers'] else 'rke2-agent' }}"
    enabled: true
    state: started

- name: Aplicar cambios pendientes de configuración RKE2
  ansible.builtin.meta: flush_handlers

- name: Esperar API en masters
  ansible.builtin.wait_for:
    port: 6443
    timeout: 600
  when: inventory_hostname in groups['rke2_servers']
