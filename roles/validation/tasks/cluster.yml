---
- name: Obtener información de nodos
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      get nodes -o wide
  register: validation_nodes
  changed_when: false
  failed_when: false

- name: Obtener información de pods
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      get pods -A -o wide
  register: validation_pods
  changed_when: false
  failed_when: false

- name: Obtener número de nodos
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      get nodes
      -o jsonpath={.items[*].metadata.name}
  register: validation_node_names
  changed_when: false
  failed_when: false

- name: Obtener nodos no Ready
  ansible.builtin.shell: |
    set -o pipefail
    /var/lib/rancher/rke2/bin/kubectl \
      --kubeconfig /etc/rancher/rke2/rke2.yaml \
      get nodes --no-headers |
    awk '$2 != "Ready" {print}'
  args:
    executable: /bin/bash
  register: validation_not_ready_nodes
  changed_when: false
  failed_when: false

- name: Obtener pods problemáticos
  ansible.builtin.shell: |
    set -o pipefail
    /var/lib/rancher/rke2/bin/kubectl \
      --kubeconfig /etc/rancher/rke2/rke2.yaml \
      get pods -A --no-headers |
    awk '
      $4 != "Running" &&
      $4 != "Completed" &&
      $4 != "Succeeded" {
        print
      }
    '
  args:
    executable: /bin/bash
  register: validation_problematic_pods
  changed_when: false
  failed_when: false
