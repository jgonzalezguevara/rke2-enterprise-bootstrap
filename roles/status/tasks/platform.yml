---
- name: Obtener nodos Kubernetes
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      get nodes -o wide
  register: status_nodes
  changed_when: false
  failed_when: false

- name: Obtener nombres de nodos Kubernetes
  ansible.builtin.command:
    cmd: >-
      /var/lib/rancher/rke2/bin/kubectl
      --kubeconfig /etc/rancher/rke2/rke2.yaml
      get nodes
      -o jsonpath={.items[*].metadata.name}
  register: status_node_names
  changed_when: false
  failed_when: false

- name: Calcular nodos detectados
  ansible.builtin.set_fact:
    status_detected_nodes: >-
      {{
        status_node_names.stdout.split()
        | length
        if status_node_names.rc == 0
        else 0
      }}

- name: Recoger componentes de plataforma
  ansible.builtin.import_tasks: components.yml

- name: Evaluar estado observado
  ansible.builtin.import_tasks: evaluate.yml

- name: Generar informe de estado
  ansible.builtin.import_tasks: report.yml
